name: App bug
description: Something in the app is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example "iPhone 15, installed home-screen app, iOS 18.4"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
